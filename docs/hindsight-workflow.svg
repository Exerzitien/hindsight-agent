<svg xmlns="http://www.w3.org/2000/svg" width="2380" height="820" viewBox="0 0 2380 820">
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#59676d"/></marker>
</defs>
<rect width="100%" height="100%" fill="#fbfcfc"/>
<text x="70" y="86" font-family="Arial, Microsoft YaHei, sans-serif" font-size="42" font-weight="700" fill="#162126">Hindsight Safety Agent：每日事故监控与本厂风险匹配工作流</text>
<text x="72" y="135" font-family="Arial, Microsoft YaHei, sans-serif" font-size="21" fill="#59676d">每一步都复用成熟组件；项目代码只实现事故证据、工厂风险和可解释评分的业务契约</text>
<rect x="70" y="245" width="280" height="260" rx="7" fill="#e8f1ee" stroke="#285b4c" stroke-width="2"/>
<text x="210" y="293" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#285b4c">1. 每日触发</text>
<text x="210" y="365" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#243238">Windows Task Scheduler</text>
<text x="210" y="407" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#243238">AWS EventBridge Scheduler</text>
<line x1="357" y1="375" x2="384" y2="375" stroke="#59676d" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="390" y="245" width="280" height="260" rx="7" fill="#e6eef6" stroke="#315b7d" stroke-width="2"/>
<text x="530" y="293" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#315b7d">2. Agent 编排</text>
<text x="530" y="365" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#243238">Strands Agent</text>
<text x="530" y="407" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#243238">@tool / OllamaModel</text>
<text x="530" y="449" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#243238">固定工具边界</text>
<line x1="677" y1="375" x2="704" y2="375" stroke="#59676d" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="710" y="245" width="280" height="260" rx="7" fill="#fff3d9" stroke="#91651c" stroke-width="2"/>
<text x="850" y="293" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#91651c">3. 官方资料采集</text>
<text x="850" y="365" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#243238">requests + BeautifulSoup</text>
<text x="850" y="407" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#243238">OSHA SIR + News RSS</text>
<text x="850" y="449" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#243238">SHA-256 不可变快照</text>
<line x1="997" y1="375" x2="1024" y2="375" stroke="#59676d" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1030" y="245" width="280" height="260" rx="7" fill="#f5e8ed" stroke="#8a405b" stroke-width="2"/>
<text x="1170" y="293" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#8a405b">4. 增量入库与切片</text>
<text x="1170" y="365" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#243238">SQLite UPSERT</text>
<text x="1170" y="407" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#243238">正文提取 + RAG 文档</text>
<text x="1170" y="449" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#243238">内容哈希去重</text>
<line x1="1317" y1="375" x2="1344" y2="375" stroke="#59676d" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1350" y="245" width="280" height="260" rx="7" fill="#e9e6f4" stroke="#5c5089" stroke-width="2"/>
<text x="1490" y="293" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#5c5089">5. 向量化与检索</text>
<text x="1490" y="365" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#243238">Ollama nomic-embed</text>
<text x="1490" y="407" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#243238">pymilvus / Milvus</text>
<text x="1490" y="449" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#243238">AUTOINDEX + COSINE</text>
<line x1="1637" y1="375" x2="1664" y2="375" stroke="#59676d" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1670" y="245" width="280" height="260" rx="7" fill="#e5f0f4" stroke="#356879" stroke-width="2"/>
<text x="1810" y="293" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#356879">6. 工厂风险匹配</text>
<text x="1810" y="365" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#243238">70% 语义 + 15% 危险词</text>
<text x="1810" y="407" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#243238">10% NAICS + 5% 后果</text>
<text x="1810" y="449" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#243238">hybrid-v1.0</text>
<line x1="1957" y1="375" x2="1984" y2="375" stroke="#59676d" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="1990" y="245" width="280" height="260" rx="7" fill="#f8e7e4" stroke="#9b3e35" stroke-width="2"/>
<text x="2130" y="293" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#9b3e35">7. 只在需要时提醒</text>
<text x="2130" y="365" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#243238">SQLite 审计视图</text>
<text x="2130" y="407" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#243238">Streamlit 决策台</text>
<text x="2130" y="449" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="17" fill="#243238">人工确认 / 忽略</text>
<rect x="640" y="610" width="1100" height="125" rx="7" fill="#edf0f1" stroke="#536168" stroke-width="2" stroke-dasharray="9 7"/>
<text x="1190" y="660" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="20" font-weight="600" fill="#36454b">全链路可观测性（不改变业务流程）</text>
<text x="1190" y="700" text-anchor="middle" font-family="Arial, Microsoft YaHei, sans-serif" font-size="19" font-weight="600" fill="#36454b">StrandsTelemetry → OpenTelemetry OTLP → Jaeger / AgentCore Observability</text>
</svg>